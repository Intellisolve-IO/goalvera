name: tests

# Backend (pytest) and frontend (npm test) on every pull request and every push to main.
# Branch protection on main requires both jobs. The firmware build is its own workflow
# (firmware-idf.yml). Offline only: no cloud credentials, Google libraries are stubbed in tests.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/backend-pipeline/requirements-pipeline.txt
            app/backend-pipeline/review_api/requirements.txt
            app/review-web/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r app/backend-pipeline/requirements-pipeline.txt \
                      -r app/review-web/requirements.txt \
                      -r app/backend-pipeline/review_api/requirements.txt
      - name: pytest
        run: python -m pytest app/backend-pipeline/tests -q

  frontend:
    name: frontend (npm test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend-web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Build check
        run: npx vite build
